name: SUMI AI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "SUMI AI/**"
      - ".github/workflows/sumi-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "SUMI AI/package-lock.json"
      - name: Install dependencies
        working-directory: "SUMI AI"
        run: npm ci
      - name: Build web app
        working-directory: "SUMI AI"
        run: npm run build
      - name: Sync Android
        working-directory: "SUMI AI"
        run: npx cap sync android
      - name: Build APK
        working-directory: "SUMI AI/android"
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sumi-ai-debug-apk
          path: "SUMI AI/android/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          retention-days: 7
