<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a0d18" />
      <stop offset="60%" stop-color="#14080e" />
      <stop offset="100%" stop-color="#070305" />
    </radialGradient>
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="50%" stop-color="#e60049" />
      <stop offset="100%" stop-color="#800020" />
    </linearGradient>
    <linearGradient id="silverHair" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGlow)" stroke="#33111b" stroke-width="4" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="url(#neonRed)" stroke-width="3" opacity="0.4" stroke-dasharray="8 6" />
  <circle cx="256" cy="230" r="145" fill="none" stroke="#ff2d55" stroke-width="1.5" opacity="0.6" filter="url(#glow)" />

  <!-- Anime Girl Silhouette (Sumi) -->
  <g transform="translate(0, -10)">
    <!-- Back Hair Flow -->
    <path d="M190 200 C150 240, 140 320, 160 380 C180 340, 200 300, 210 270 Z" fill="url(#silverHair)" opacity="0.9" />
    <path d="M322 200 C362 240, 372 320, 352 380 C332 340, 312 300, 302 270 Z" fill="url(#silverHair)" opacity="0.9" />

    <!-- Cute Red Ribbon / Hair Accessory -->
    <path d="M210 135 Q225 120 240 140 Q255 120 270 135 Q255 150 240 142 Z" fill="#ff1a4b" filter="url(#glow)" />
    <circle cx="240" cy="140" r="4.5" fill="#ffffff" />

    <!-- Face & Neck -->
    <path d="M236 210 L236 240 L276 240 L276 210 Z" fill="#fce7df" />
    <path d="M205 160 Q205 235 256 245 Q307 235 307 160 Q256 145 205 160 Z" fill="#fff1eb" />
    
    <!-- Blush -->
    <ellipse cx="225" cy="202" rx="10" ry="4" fill="#ff708f" opacity="0.55" />
    <ellipse cx="287" cy="202" rx="10" ry="4" fill="#ff708f" opacity="0.55" />

    <!-- Eyes (Magical brown with anime shine) -->
    <ellipse cx="230" cy="190" rx="9" ry="12" fill="#5c2c16" />
    <circle cx="228" cy="186" r="3.5" fill="#ffffff" />
    <circle cx="232" cy="194" r="1.5" fill="#fbb6ce" />
    
    <ellipse cx="282" cy="190" rx="9" ry="12" fill="#5c2c16" />
    <circle cx="280" cy="186" r="3.5" fill="#ffffff" />
    <circle cx="284" cy="194" r="1.5" fill="#fbb6ce" />

    <!-- Sweet Smile -->
    <path d="M246 214 Q256 222 266 214" stroke="#e0526e" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Front Silver Bangs & Twintails -->
    <path d="M200 150 C215 175, 230 180, 240 170 C246 182, 260 180, 275 168 C285 180, 305 175, 312 150 C312 130, 290 120, 256 120 C220 120, 200 130, 200 150 Z" fill="url(#silverHair)" />
    <!-- Bang strands -->
    <path d="M245 155 Q252 185 255 190 Q258 185 262 160 Z" fill="#f1f5f9" />
    <path d="M215 155 Q212 210 215 225 Q222 200 226 170 Z" fill="#e2e8f0" />
    <path d="M297 155 Q300 210 297 225 Q290 200 286 170 Z" fill="#e2e8f0" />

    <!-- Modern Red + Black Collar / Choker -->
    <path d="M232 238 L280 238 L278 248 L234 248 Z" fill="#18181b" stroke="#ff2d55" stroke-width="1.2" />
    <!-- Heart charm -->
    <path d="M256 250 Q252 245 248 249 Q244 253 256 261 Q268 253 264 249 Q260 245 256 250 Z" fill="#ff2d55" />

    <!-- Dress Shoulders -->
    <path d="M190 270 Q256 255 322 270 L340 330 Q256 315 172 330 Z" fill="#18181b" stroke="#ff2d55" stroke-width="1.5" />
    <path d="M225 264 L287 264 L282 300 L230 300 Z" fill="#881337" opacity="0.8" />
  </g>

  <!-- SUMI AI Typography -->
  <text x="256" y="420" font-family="'Outfit', system-ui, sans-serif" font-weight="800" font-size="38" fill="#ffffff" text-anchor="middle" letter-spacing="4">SUMI AI</text>
  <text x="256" y="448" font-family="'Hind Siliguri', system-ui, sans-serif" font-weight="600" font-size="19" fill="#ff4d79" text-anchor="middle" letter-spacing="1">সুমি — ৩ডি এআই সহচর</text>

  <!-- Tech Dots / Signal Indicator -->
  <circle cx="216" cy="475" r="3" fill="#ff2d55" />
  <circle cx="256" cy="475" r="3" fill="#22c55e" />
  <circle cx="296" cy="475" r="3" fill="#ff2d55" />
</svg>
